<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PondSight</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { margin: 0; background: #0b2545; color: #eaf2f8; }
        .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
        h1 { color: #81d4fa; }
        .card { background: #13315c; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .drop { border: 2px dashed #81d4fa; border-radius: 10px; padding: 30px;
                text-align: center; cursor: pointer; }
        .drop.hover { background: #1a3a6b; }
        .btn { background: #81d4fa; color: #0b2545; border: none; padding: 10px 20px;
               border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin: 10px 0; font-size: 15px; }
        .progress { width: 100%; height: 12px; background: #0b2545; border-radius: 6px; overflow: hidden; }
        .bar { width: 0%; height: 100%; background: #81d4fa; transition: width 0.5s; }
        .outputs { display: none; }
        .out-grid { display: flex; gap: 12px; flex-wrap: wrap; }
        .out-card { flex: 1 1 200px; background: #0b2545; border-radius: 8px; padding: 12px;
                     text-align: center; }
        .out-card a { color: #81d4fa; }
        video, img { width: 100%; border-radius: 8px; margin-top: 8px; }
        pre { background: #0b2545; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; }
        .loading { display: none; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>PondSight - Fish Monitor</h1>

    <div class="card">
        <div class="drop" id="drop">
            <p><strong>Click or drop an underwater fish video here</strong></p>
            <p>Maximum: 50 MB and 3 minutes per video.</p>
            <p id="fileinfo" style="color:#9fb6d4;">No file selected</p>
            <input type="file" id="file" accept="video/*" style="display:none;">
        </div>
        <br>
        <button class="btn" id="run" disabled>Analyze Video</button>
        <div id="status"></div>
        <div class="progress"><div class="bar" id="bar"></div></div>
    </div>

    <div class="card outputs" id="outputs">
        <h2 style="margin-top:0;">Results</h2>
        <div class="out-grid">
            <div class="out-card">
                <a href="#" id="a-video" download>Annotated Video</a>
                <video id="player" controls></video>
            </div>
            <div class="out-card">
                <a href="#" id="a-plot" download>Plot</a>
                <img id="img-plot" src="">
            </div>
            <div class="out-card">
                <a href="#" id="a-metrics" download>metrics.md</a>
            </div>
            <div class="out-card">
                <a href="#" id="a-csv" download>timeseries.csv</a>
            </div>
        </div>
        <h3>metrics.md</h3>
        <pre id="pnl-metrics"></pre>
    </div>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const fileinfo = document.getElementById('fileinfo');
const runBtn = document.getElementById('run');
let selectedFile = null;
let fileValid = false;
const maxVideoBytes = {{ max_video_bytes | tojson }};
const maxVideoSeconds = {{ max_video_seconds | tojson }};

drop.onclick = () => fileInput.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('hover');
    selectedFile = e.dataTransfer.files[0]; updateFile(); };
fileInput.onchange = () => { selectedFile = fileInput.files[0]; updateFile(); };

function updateFile() {
    fileValid = false;
    runBtn.disabled = true;
    const file = selectedFile;
    if (!file) { fileinfo.textContent = 'No file selected'; return; }
    fileinfo.textContent = file.name + ' (' + (file.size/1048576).toFixed(1) + ' MB)';
    if (file.size > maxVideoBytes) {
        setStatus('Video exceeds the 50 MB size limit.', 0);
        return;
    }
    setStatus('Checking video duration...', 0);
    const video = document.createElement('video');
    const url = URL.createObjectURL(file);
    video.preload = 'metadata';
    video.onloadedmetadata = () => {
        URL.revokeObjectURL(url);
        if (selectedFile !== file) return;
        fileValid = Number.isFinite(video.duration) && video.duration > 0 && video.duration <= maxVideoSeconds;
        setStatus(fileValid ? 'Ready to analyze.' : 'Video must be readable and no longer than 3 minutes.', 0);
        runBtn.disabled = analyzing || !fileValid;
    };
    video.onerror = () => {
        URL.revokeObjectURL(url);
        if (selectedFile !== file) return;
        // The server can validate formats this browser cannot preview.
        fileValid = true;
        setStatus('Duration will be checked by the server before analysis.', 0);
        runBtn.disabled = analyzing;
    };
    video.src = url;
}

let jobId = null;
let analyzing = false;
runBtn.onclick = async () => {
    if (analyzing || !fileValid) return;
    analyzing = true;
    runBtn.disabled = true;
    document.getElementById('outputs').style.display = 'none';
    const fd = new FormData();
    fd.append('video', selectedFile);
    setStatus('Uploading...', 0);
    try {
        const response = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Upload failed (' + response.status + ').');
        if (data.error) throw new Error(data.error);
        jobId = data.job_id;
        poll();
    } catch (error) {
        setStatus(error.message, 0);
        finish();
    }
};

function finish() {
    analyzing = false;
    runBtn.disabled = !fileValid;
}

async function poll() {
    try {
        const response = await fetch('/api/status/' + jobId);
        if (response.status === 404) {
            setStatus('Analysis job was lost after a server restart. Please analyze again.', 0);
            finish();
            return;
        }
        if (!response.ok) throw new Error('Status unavailable');
        const s = await response.json();
        setStatus(s.log, s.progress || 0);
        if (s.status === 'done') { finish(); showOutputs(); return; }
        if (s.status === 'error') { finish(); return; }
    } catch (error) {
        document.getElementById('status').textContent = 'Connection interrupted. Retrying...';
    }
    setTimeout(poll, 1500);
}

function setStatus(text, pct) {
    document.getElementById('status').textContent = text;
    document.getElementById('bar').style.width = pct + '%';
}

function showOutputs() {
    const base = '/api/file/' + jobId;
    document.getElementById('outputs').style.display = 'block';
    document.getElementById('a-video').href = base + '/annotated.mp4';
    document.getElementById('player').src = base + '/annotated.mp4';
    document.getElementById('a-plot').href = base + '/plot.png';
    document.getElementById('img-plot').src = base + '/plot.png';
    document.getElementById('a-metrics').href = base + '/metrics.md';
    document.getElementById('a-csv').href = base + '/timeseries.csv';
    fetch(base + '/metrics.md').then(r => r.text())
        .then(t => document.getElementById('pnl-metrics').textContent = t);
}
</script>
</body>
</html>
